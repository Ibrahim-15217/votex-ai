name: votex-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: votex
      POSTGRES_PASSWORD: votex
      POSTGRES_DB: votex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votex -d votex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: votex
      MINIO_ROOT_PASSWORD: votex-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      SECRET_KEY: change-me-before-any-public-deployment
      DATABASE_URL: postgresql+psycopg2://votex:votex@db:5432/votex
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      EVIDENCE_DIR: /app/storage/evidence
      MODEL_PATH: /app/ai-engine/models/phishing_model.joblib
      K_ANONYMITY: "5"
      AUTO_SEED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine/models:/app/ai-engine/models:ro
      - evidence_data:/app/storage/evidence
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  evidence_data:
